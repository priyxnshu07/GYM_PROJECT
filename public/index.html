<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Discovery</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body style="background-image: url('images/image.png');">
    <header>
        <div class="container">
            <nav id="navbar">
                <h1 id="home-heading"><a href="index.html">GYM DISCOVERY</a></h1>
                <ul id="nav-links">
                    <li><a href="pages/auth/login.html">Login</a></li>
                    <li><a href="pages/auth/register.html">Sign Up</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero cinematic-hero">
            <div class="hero-content" style="max-width: 900px; margin: 0 auto;">
                <h2 class="animate-fade-up" style="font-size: 4.5rem; letter-spacing: -1px;">ONE PLATFORM FOR <br><span>PUSHING YOUR LIMITS</span></h2>
                <div class="actions animate-fade-up animation-delay-2">
                    <a href="pages/public/search-gyms.html" class="btn">Start Now</a>
                </div>
            </div>
        </section>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3>Featured Studios</h3>
            <a href="pages/public/search-gyms.html" style="color:var(--primary-neon-green); text-decoration:none; font-weight:600; text-transform:uppercase; letter-spacing:1px; font-size:0.9rem;">View All
                &rarr;</a>
        </div>

        <div id="featured-gyms" class="card-grid">
            <!-- Loaded by JS -->
        </div>

        <div
            style="margin-top: 80px; text-align: center; color: var(--text-muted); opacity: 0.5; padding-bottom: 20px;">
            <p>&copy; 2026 Gym Discovery Platform. Built for excellence.</p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        async function loadFeatured() {
            UI.showLoading('featured-gyms');
            const res = await api.searchGyms({ limit: 4 });

            if (res.success && res.data.gyms.length > 0) {
                const gyms = res.data.gyms;
                document.getElementById('featured-gyms').innerHTML = gyms.map(gym => `
                    <div class="card">
                        <h3 style="color:#fff; text-transform:uppercase; letter-spacing:1px; margin-bottom:5px;">${gym.name}</h3>
                        <p style="color:var(--primary-neon-green); margin-bottom:15px; font-weight:600; font-size:0.9rem;">📍 ${gym.address.city}</p>
                        <hr style="border:0; border-top:1px solid var(--border-subtle); margin-bottom:15px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                             <span style="color:var(--text-muted); font-size:0.9rem;">Rating: ${gym.rating || 'New'}</span>
                             <span style="color:#fff; font-weight:700;">$${gym.pricing ? gym.pricing.monthlyMembership : 'N/A'}/mo</span>
                        </div>
                    </div>
                 `).join('');
            } else {
                UI.showEmpty('featured-gyms', 'No active gyms needed for the demo.');
            }
        }
        loadFeatured();
    </script>
</body>

</html>
