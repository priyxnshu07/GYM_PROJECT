<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>New User Registration - Gym Discovery</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .error-message {
            color: #ff4d4d;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ff4d4d;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <h1><a href="../../index.html">GYM DISCOVERY</a></h1>
            </nav>
        </div>
    </header>

    <div class="auth-container">
        <form id="register-enhanced-form" style="width: 100%; max-width: 500px;">
            <h2 style="text-align:center; font-size:2rem; margin-bottom:10px;">New User Registration</h2>
            <p style="text-align:center; color:var(--text-muted); margin-bottom:30px;">Complete the details below to join.
            </p>

            <div id="validation-errors" class="error-message"></div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Choose a unique username">
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
                <small style="color:var(--text-muted); font-size: 0.75rem; display: block; margin-top: 5px;">
                    Must be 8-15 chars, include upper, lower, digit, and special char (!@#$%&*()-+=^).
                </small>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" required placeholder="+1 234 567 890">
            </div>

            <div class="form-group">
                <label>I am a...</label>
                <select id="role">
                    <option value="user">Gym Member</option>
                    <option value="trainer">Personal Trainer</option>
                    <option value="gymOwner">Gym Owner</option>
                </select>
            </div>

            <button type="submit" class="btn" style="width:100%; margin-top:20px;" id="register-submit">Register Now</button>
            <p style="margin-top: 20px; text-align:center; color: var(--text-muted);">
                Already have an account? <a href="login.html" style="color:var(--primary-neon-green);">Log In</a>
            </p>
        </form>
    </div>

    <script src="../../js/api.js"></script>
    <script>
        const form = document.getElementById('register-enhanced-form');
        const errorDiv = document.getElementById('validation-errors');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            errorDiv.innerText = '';

            const password = document.getElementById('password').value;
            const errors = [];

            // Password constraints validation
            if (password.length < 8 || password.length > 15) {
                errors.push("Password must be between 8 and 15 characters.");
            }
            if (!/\d/.test(password)) {
                errors.push("Password must contain at least one digit.");
            }
            if (!/[A-Z]/.test(password)) {
                errors.push("Password must contain at least one upper case alphabet.");
            }
            if (!/[a-z]/.test(password)) {
                errors.push("Password must contain at least one lower case alphabet.");
            }
            if (!/[!@#$%&*()\-\+=\^]/.test(password)) {
                errors.push("Password must contain at least one special character (!@#$%&*()-+=^).");
            }
            if (/\s/.test(password)) {
                errors.push("Password must not contain any white space.");
            }

            if (errors.length > 0) {
                errorDiv.innerHTML = errors.join('<br>');
                errorDiv.style.display = 'block';
                return;
            }

            const btn = document.getElementById('register-submit');
            btn.disabled = true;
            btn.textContent = 'Registering...';

            const data = {
                username: document.getElementById('username').value,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: password,
                phone: document.getElementById('phone').value,
                role: document.getElementById('role').value
            };

            // Using existing API helper
            const res = await api.register(data);

            if (res.success) {
                alert('Registration successful! Redirecting to login...');
                window.location.href = 'login.html';
            } else {
                btn.disabled = false;
                btn.textContent = 'Register Now';
                errorDiv.innerText = res.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
