<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Owner Dashboard - Gym Discovery</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body style="background-image: url('../../images/image%20copy%202.png'); background-size: cover; background-position: center;">
    <header>
        <div class="container">
            <nav>
                <h1><a href="../../index.html">GYM DISCOVERY</a></h1>
                <ul id="nav-links">
                    <li><a href="#" onclick="api.logout()">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <div style="display:flex; justify-content: space-between; align-items: center; background: linear-gradient(90deg, #222, #111); padding: 40px; border-radius: 16px; margin-bottom: 40px; border: 1px solid #333;">
            <div>
                <h2 style="margin-bottom: 5px;">Hello, <span id="username" style="color:var(--primary-neon-green);">Owner</span></h2>
                <p style="color:var(--text-muted);">Manage your facilities today.</p>
            </div>
            
            <svg class="svg-deadlift" viewBox="0 0 300 300" style="width: 150px; height: 150px; filter: drop-shadow(0 10px 20px rgba(204, 255, 0, 0.15));" xmlns="http://www.w3.org/2000/svg">
                <!-- Floor -->
                <rect x="20" y="270" width="260" height="4" fill="#333" />
                <!-- Static Legs under Torso -->
                <rect x="135" y="190" width="14" height="80" fill="#777" />
                <rect x="151" y="190" width="14" height="80" fill="#777" />
                
                <!-- Animated Lifter (Torso + Arms + Barbell) -->
                <g class="deadlift-lifter">
                   <!-- Head -->
                   <circle cx="150" cy="80" r="18" fill="#fff" />
                   <!-- Long Torso to cover legs when moving up -->
                   <path d="M110,120 Q150,130 190,120 L165,250 L135,250 Z" fill="#fff" />
                   <!-- Shoulders -->
                   <path d="M90,125 L210,125" stroke="#fff" stroke-width="24" stroke-linecap="round" />
                   <!-- Arms -->
                   <rect x="90" y="125" width="16" height="100" fill="#ccc" rx="8" />
                   <rect x="194" y="125" width="16" height="100" fill="#ccc" rx="8" />
                   
                   <!-- Barbell Bar -->
                   <rect x="30" y="215" width="240" height="10" fill="#fff" rx="4" />
                   <!-- Left Plates -->
                   <rect x="50" y="170" width="20" height="100" fill="#CCFF00" rx="4" />
                   <rect x="40" y="180" width="10" height="80" fill="#9acd32" rx="2" />
                   <!-- Right Plates -->
                   <rect x="230" y="170" width="20" height="100" fill="#CCFF00" rx="4" />
                   <rect x="250" y="180" width="10" height="80" fill="#9acd32" rx="2" />
                </g>
            </svg>
        </div>

        <div class="card-grid">
            <div class="card">
                <h3>My Gyms</h3>
                <p>Update gym details and photos.</p>
                <button class="btn" style="margin-top:15px;" onclick="alert('Gym Manager Coming Soon')">Manage
                    Gyms</button>
            </div>

            <div class="card">
                <h3>Recruitment</h3>
                <p>Post new jobs and find trainers.</p>
                <button class="btn" style="margin-top:15px;" onclick="alert('Job Poster Coming Soon')">Post Job</button>
            </div>

            <div class="card">
                <h3>Applications</h3>
                <p>Review incoming trainer applications.</p>
                <div style="margin-top:20px;">
                    <div style="font-size:2rem; font-weight:bold; color:var(--primary-neon-green);">2</div>
                    <span style="font-size:0.8rem; color:var(--text-muted);">New Requests</span>
                </div>
                <a href="view-applications.html" class="btn btn-secondary" style="margin-top:15px; width:100%;">View Applications</a>
            </div>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/ui.js"></script>
    <script>
        const user = api.getCurrentUser();
        if (user && user.name) {
            document.getElementById('username').innerText = user.name;
        }
    </script>
</body>

</html>
