<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Search Gyms - Gym Discovery</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body style="background-image: url('../../images/image%20copy.png');">
    <header>
        <div class="container">
            <nav>
                <h1><a href="../../index.html">GYM DISCOVERY</a></h1>
                <ul id="nav-links"></ul> <!-- Populated by ui.js -->
            </nav>
        </div>
    </header>

    <div class="container">
        <div style="text-align: center; margin-bottom: 20px;">
            <svg class="svg-pullup" viewBox="0 0 300 300" style="width: 150px; height: 150px; margin: 0 auto; display: block; filter: drop-shadow(0 10px 20px rgba(204, 255, 0, 0.15));" xmlns="http://www.w3.org/2000/svg">
                <!-- Pull-up Bar -->
                <rect x="40" y="50" width="220" height="10" fill="#fff" rx="5" />
                
                <!-- Torso sliding up down -->
                <g class="pullup-torso">
                    <!-- Head -->
                    <circle cx="150" cy="110" r="22" fill="#fff" />
                    <!-- Torso V-shape (shoulders at Y=140) -->
                    <path d="M100,140 Q150,150 200,140 L170,250 L130,250 Z" fill="#fff" />
                </g>
                <!-- Arms scaling Y -->
                <g class="pullup-arms">
                    <!-- left arm (from Y=60 to Y=140) -->
                    <rect x="100" y="60" width="16" height="80" fill="#ccc" rx="8" />
                    <!-- right arm -->
                    <rect x="184" y="60" width="16" height="80" fill="#ccc" rx="8" />
                    
                    <!-- Hands over the bar -->
                    <rect x="95" y="45" width="26" height="20" fill="var(--primary-neon-green)" rx="8" />
                    <rect x="179" y="45" width="26" height="20" fill="var(--primary-neon-green)" rx="8" />
                </g>
            </svg>
        </div>
        <h2 style="text-align:center;">Discover Premium Spaces</h2>
        <p style="text-align:center; color:var(--text-muted); margin-bottom:40px;">Find the perfect environment for your
            workout.</p>

        <form id="search-form" class="search-form">
            <div class="grid-fields">
                <div class="form-group">
                    <label>City Location</label>
                    <input type="text" id="city-input" placeholder="e.g. New York">
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" id="state" placeholder="e.g. NY">
                </div>
                <div class="form-group">
                    <label>Min Rating</label>
                    <select id="minRating">
                        <option value="">Any Rating</option>
                        <option value="4">⭐⭐⭐⭐ & Up</option>
                        <option value="3">⭐⭐⭐ & Up</option>
                    </select>
                </div>
            </div>
            <div style="text-align:center;">
                <button type="submit" class="btn" id="search-button" style="min-width: 200px;">Search Gyms</button>
            </div>
        </form>

        <div id="gym-results" class="card-grid">
            <!-- Results injected here -->
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/ui.js"></script>
    <script>
        const form = document.getElementById('search-form');
        const results = document.getElementById('gym-results');

        // Initial Load
        fetchgyms({});

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const filters = {
                city: document.getElementById('city-input').value,
                state: document.getElementById('state').value,
                minRating: document.getElementById('minRating').value
            };
            fetchgyms(filters);
        });

        async function fetchgyms(filters) {
            UI.showLoading('gym-results');
            const btn = document.getElementById('search-button');
            btn.disabled = true;
            btn.textContent = 'Searching...';

            const res = await api.searchGyms(filters);

            btn.disabled = false;
            btn.textContent = 'Search Gyms';

            if (res.success) {
                if (res.data.gyms.length === 0) {
                    UI.showEmpty('gym-results', 'No gyms found. Try broader filters.');
                    return;
                }
                renderGyms(res.data.gyms);
            } else {
                UI.showError('gym-results', res.message);
            }
        }

        function renderGyms(gyms) {
            results.innerHTML = gyms.map(gym => {
                const facilitiesHtml = gym.facilities && gym.facilities.length
                    ? gym.facilities.slice(0, 3).map(f => `<span class="tag">${formatText(f)}</span>`).join('')
                    : '';

                const extraCount = gym.facilities && gym.facilities.length > 3
                    ? `<span class="tag" style="background:transparent; border:1px solid var(--border-subtle); color:var(--text-muted);">+${gym.facilities.length - 3}</span>`
                    : '';

                return `
                        <div class="card">
                        <h3 style="text-transform:uppercase; letter-spacing:1px; margin-bottom:5px;">${gym.name || 'Unnamed Gym'}</h3>
                        <p style="color:var(--primary-neon-green); font-weight:600; font-size:0.9rem;">📍 ${gym.address.city}, ${gym.address.state}</p>
                        <div style="margin: 15px 0;">
                            ${facilitiesHtml} ${extraCount}
                        </div>
                        <p style="font-size: 0.9rem; color: var(--text-muted); line-height:1.5;">
                            ${gym.description ? gym.description.substring(0, 80) + '...' : 'Premium facility waiting for you.'}
                        </p>
                        <hr style="border:0; border-top:1px solid var(--border-subtle); margin:15px 0;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                             <span style="color:#fff; font-weight:600; font-size:0.9rem;">★ ${gym.rating ? gym.rating : 'New'}</span>
                             ${gym.pricing ? `<span style="color:#fff; font-weight:bold;">$${gym.pricing.monthlyMembership}/mo</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatText(str) {
            return str.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }
    </script>
</body>

</html>
