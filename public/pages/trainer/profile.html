<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Profile - Gym Discovery</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .form-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #222;
        }
        .form-section h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--primary-neon-green);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <h1><a href="../../index.html">GYM DISCOVERY</a></h1>
                <ul id="nav-links">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="#" onclick="api.logout()">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container" style="max-width: 800px; margin-bottom: 60px;">
        <h2 style="text-align:center;">Build Your Trainer Profile</h2>
        <p style="text-align:center; color:var(--text-muted); margin-bottom:40px;">Professional details help clients in Noida, Delhi, and Patiala find you.</p>

        <form id="profile-form">
            <div id="msg-box"></div>

            <!-- Essential Info -->
            <div class="form-section">
                <h3>Core Details</h3>
                <div class="grid-fields">
                    <div class="form-group">
                        <label>Hourly Rate (₹)</label>
                        <input type="number" id="hourlyRate" placeholder="e.g. 2000" required>
                    </div>
                    <div class="form-group">
                        <label>Years of Experience</label>
                        <input type="number" id="experienceYears" placeholder="e.g. 5" required>
                    </div>
                </div>
                <div class="grid-fields">
                    <div class="form-group">
                        <label>Primary Location</label>
                        <select id="city" required>
                            <option value="Noida">Noida</option>
                            <option value="Delhi">Delhi</option>
                            <option value="Patiala">Patiala</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Expertise -->
            <div class="form-section">
                <h3>Expertise & Training</h3>
                <div class="form-group">
                    <label>Specializations (Comma separated)</label>
                    <input type="text" id="specializations" placeholder="Weight Training, Yoga, Boxing" required>
                    <small style="color:var(--text-muted);">Common: Cardio, Bodybuilding, Crossfit, MMA, Rehab</small>
                </div>
                <div class="form-group">
                    <label>Certifications (Comma separated)</label>
                    <input type="text" id="certifications" placeholder="ACE, NASM, ISSA">
                </div>
            </div>

            <!-- Availability -->
            <div class="form-section">
                <h3>Weekly Availability</h3>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" name="days" value="monday"> Monday</label>
                    <label class="checkbox-item"><input type="checkbox" name="days" value="tuesday"> Tuesday</label>
                    <label class="checkbox-item"><input type="checkbox" name="days" value="wednesday"> Wednesday</label>
                    <label class="checkbox-item"><input type="checkbox" name="days" value="thursday"> Thursday</label>
                    <label class="checkbox-item"><input type="checkbox" name="days" value="friday"> Friday</label>
                    <label class="checkbox-item"><input type="checkbox" name="days" value="saturday"> Saturday</label>
                    <label class="checkbox-item"><input type="checkbox" name="days" value="sunday"> Sunday</label>
                </div>
            </div>

            <div class="form-group">
                <label>Bio & Philosophy</label>
                <textarea id="bio" rows="5" placeholder="Tell clients about your philosophy and style..."
                    style="width:100%; background:rgba(0,0,0,0.3); color:white; border:1px solid #333; padding:10px; border-radius:8px;"></textarea>
            </div>

            <button type="submit" class="btn" style="width:100%;">Save Professional Profile</button>
        </form>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/ui.js"></script>
    <script>
        const form = document.getElementById('profile-form');
        const box = document.getElementById('msg-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const specMap = {
                'weight training': 'weight_training',
                'cardio': 'cardio',
                'yoga': 'yoga',
                'pilates': 'pilates',
                'crossfit': 'crossfit',
                'bodybuilding': 'bodybuilding',
                'powerlifting': 'powerlifting',
                'zumba': 'zumba',
                'aerobics': 'aerobics',
                'martial arts': 'martial_arts',
                'boxing': 'boxing',
                'kickboxing': 'kickboxing',
                'mma': 'mma',
                'rehab': 'rehabilitation',
                'rehabilitation': 'rehabilitation',
                'nutrition': 'nutrition'
            };

            const rawSpecs = document.getElementById('specializations').value.split(',').map(s => s.trim().toLowerCase());
            const mappedSpecs = rawSpecs.map(s => specMap[s] || 'other');

            const selectedDays = Array.from(document.querySelectorAll('input[name="days"]:checked')).map(cb => cb.value);

            const payload = {
                hourlyRate: document.getElementById('hourlyRate').value,
                experienceYears: document.getElementById('experienceYears').value,
                specializations: mappedSpecs,
                certifications: document.getElementById('certifications').value.split(',').map(s => ({ name: s.trim() })),
                bio: document.getElementById('bio').value,
                availability: selectedDays.map(day => ({ day, timeSlots: [{ startTime: "06:00", endTime: "22:00" }] }))
            };

            // Also update User location (city) if changed
            const city = document.getElementById('city').value;
            await api.request('/users/me', 'PUT', { location: { city } });

            let res = await api.request('/trainers/profile', 'POST', payload);

            if (!res.success && (res.status === 409 || res.message.includes('exists'))) {
                res = await api.request('/trainers/profile', 'PUT', payload);
            }

            btn.disabled = false;
            btn.textContent = 'Save Professional Profile';

            if (res.success) {
                box.innerHTML = '<div class="success-state" style="color:#00ff9d; margin-bottom:20px; text-align:center;">Profile Published Successfully!</div>';
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            } else {
                box.innerHTML = `<div class="error-msg" style="text-align:center; margin-bottom:20px; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 4px; border: 1px solid red;">${res.message}</div>`;
            }
        });
    </script>
</body>

</html>
