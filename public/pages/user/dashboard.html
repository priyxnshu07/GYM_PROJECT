<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Gym Discovery</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <h1><a href="../../index.html">GYM DISCOVERY</a></h1>
                <ul id="nav-links">
                    <li><a href="#" onclick="api.logout()">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <div
            style="background: linear-gradient(90deg, #222, #111); padding: 40px; border-radius: 16px; margin-bottom: 40px; border: 1px solid #333;">
            <h2 style="margin-bottom: 5px;">Hello, <span id="username" style="color:var(--primary-neon);">User</span>
            </h2>
            <p style="color:var(--text-muted);">Welcome back to your fitness command center.</p>
        </div>

        <div class="card-grid">
            <div class="card">
                <h3>Find a Gym</h3>
                <p>Browse top-rated facilities near you.</p>
                <div style="margin-top:20px;">
                    <a href="../public/search-gyms.html" class="btn">Search Gyms</a>
                </div>
            </div>

            <div class="card">
                <h3>Find a Trainer</h3>
                <p>Connect with expert coaches.</p>
                <div style="margin-top:20px;">
                    <a href="../public/search-trainers.html" class="btn btn-secondary">Search Trainers</a>
                </div>
            </div>

            <div class="card" style="opacity: 0.7;">
                <h3>My Bookings</h3>
                <p>Manage your upcoming sessions.</p>
                <div style="margin-top:20px;">
                    <button class="btn btn-secondary" disabled>Coming Soon</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/ui.js"></script>
    <script>
        const user = api.getCurrentUser();
        if (user.role !== 'user') console.warn('Role mismatch');
        document.getElementById('username').innerText = user.name || 'User';
    </script>
</body>

</html>
